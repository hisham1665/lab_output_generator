<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="promptGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Rounded Card with Border -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12"/>
  
  <!-- Terminal Window Bar -->
  <rect x="64" y="80" width="384" height="352" rx="40" fill="#090d16" stroke="#1e293b" stroke-width="6"/>
  <circle cx="112" cy="124" r="14" fill="#ff5f56"/>
  <circle cx="152" cy="124" r="14" fill="#ffbd2e"/>
  <circle cx="192" cy="124" r="14" fill="#27c93f"/>
  <line x1="64" y1="160" x2="448" y2="160" stroke="#1e293b" stroke-width="4"/>

  <!-- Glowing Prompt >_ -->
  <path d="M 128 230 L 210 290 L 128 350" stroke="url(#promptGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <line x1="240" y1="350" x2="330" y2="350" stroke="#38bdf8" stroke-width="36" stroke-linecap="round" filter="url(#glow)"/>
</svg>
